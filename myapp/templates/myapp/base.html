<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Успеваемость{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background:#f8f9fa; }
  .grade-5 { color:#fff; background:#198754; }
  .grade-4 { color:#fff; background:#0d6efd; }
  .grade-3 { color:#fff; background:#fd7e14; }
  .grade-2 { color:#fff; background:#dc3545; }
  .grade-badge { display:inline-block; width:32px; height:32px;
                 line-height:32px; text-align:center;
                 border-radius:50%; font-weight:700; }
  .card { box-shadow: 0 2px 6px rgba(0,0,0,.06); }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'index' %}">
      <i class="bi bi-bar-chart-fill"></i> Успеваемость
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navmenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navmenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'db_list' %}">База данных</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'upload' %}">Загрузить файл</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/" target="_blank">Админка</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">

  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show">
        {{ m }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
