{% extends 'myapp/base.html' %}
{% block title %}Редактирование{% endblock %}

{% block content %}
<h1 class="mb-4">Редактирование записи #{{ grade.pk }}</h1>

<div class="card p-4">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn btn-secondary" href="{% url 'db_list' %}">Отмена</a>
  </form>
</div>
{% endblock %}
